<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance Manager · 3D Class Diagram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--ink:#eef1ff;--mute:#9aa3c7;--glass:rgba(13,16,30,.72);--line:rgba(160,175,255,.2);--bg:#0b0d16;--acc:#ff6b57;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef1ff;--mute:#9aa3c7;--glass:rgba(13,16,30,.72);--bg:#0b0d16}}
:root[data-theme="dark"]{--ink:#eef1ff;--bg:#0b0d16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px "Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.p{position:fixed;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px}
#head{top:calc(12px + env(safe-area-inset-top,0px));left:14px;padding:10px 14px;max-width:min(330px,calc(100% - 28px))}
h1{font-size:22px;line-height:1.05;margin:0 0 4px;font-weight:800}
.s{color:var(--mute);font-size:12.5px}
#nav{top:calc(104px + env(safe-area-inset-top,0px));left:14px;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 230px);overflow:auto}
button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;font-weight:600}
button:hover,button:focus-visible{background:rgba(160,175,255,.16);outline:none}
button i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
#info{top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:min(360px,calc(100% - 28px));padding:12px 14px;max-height:calc(100% - 140px);overflow:auto}
#info h2{margin:0 0 2px;font-size:24px;font-weight:800}
#info code{display:block;font:500 12px "JetBrains Mono",Consolas,monospace;margin:2px 0;color:#d8defc;white-space:normal}
#info h3{margin:10px 0 3px;font-size:12px;color:var(--mute);font-weight:600}
#leg{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 14px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font:500 12px "JetBrains Mono",Consolas,monospace;color:var(--mute);max-width:calc(100% - 28px)}
#leg b{color:var(--ink)}
#hint{bottom:calc(64px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:5px 12px;color:var(--mute);font-size:12px;white-space:nowrap}
@media (max-width:760px){#nav{display:none}#hint{display:none}.s.d{display:none}}
</style></head><body>
<canvas id="c" aria-label="3D UML class diagram"></canvas>
<div class="p" id="head"><h1>Campus Maintenance Request Manager</h1><div class="s d">UML class diagram as a 3D city: every class is a tower, every member a floor.</div></div>
<div class="p" id="nav"></div>
<div class="p" id="info" hidden></div>
<div class="p" id="hint">Drag to orbit · right-drag or Shift to pan · scroll to zoom · click a tower</div>
<div class="p" id="leg"><span><b>◆</b> composition</span><span><b>◇</b> aggregation</span><span><b>⊕</b> nested</span><span><b>▶</b> association</span><span><b>┄▶</b> dependency</span><span><b>┄▷</b> implements</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s),T=THREE;
const W=9,DP=3.4,HH=1.3,MH=.56,GAP=.05;
const CL=[
{id:"Main",pos:[-30,12],col:"#5aa9ff",a:["- manager: RequestManager","- scanner: Scanner"],m:["+ {static} main(args: String[]): void","- showMenu(): void","- handleAdd(): void","- handleSearch(): void","- handleDisplayPending(): void","- handleProcessNext(): void","- handleExit(): void","- readNonBlank(prompt: String): String","- readIntInRange(prompt: String, min: int, max: int): int"]},
{id:"FileStorageManager",pos:[-30,-14],col:"#2dd4bf",a:["- {static} FILE_NAME: String"],m:["+ {static} save(manager: RequestManager): boolean","+ {static} load(): RequestManager"]},
{id:"RequestManager",pos:[0,-2],col:"#ff6b57",a:["- allRequests: MaintenanceRequest[]","- count: int","- nextId: int","- {transient} queues: LinkedQueue[3]"],m:["+ RequestManager()","+ addRequest(location: String, desc: String, priority: int): int","+ searchById(id: int): MaintenanceRequest","+ displayPending(): void","+ processNext(): MaintenanceRequest","+ rebuildQueues(): void","- ensureCapacity(): void"]},
{id:"LinkedQueue",tag:"High",cap:"#ff4d5a",pos:[28,-12],col:"#a78bfa",a:["- head: Node","- tail: Node","- size: int"],m:["+ enqueue(r: MaintenanceRequest): void","+ dequeue(): MaintenanceRequest","+ peek(): MaintenanceRequest","+ isEmpty(): boolean","+ displayAll(): void"]},
{id:"LinkedQueue",tag:"Medium",cap:"#ffb02e",pos:[28,-1],col:"#a78bfa",a:["- head: Node","- tail: Node","- size: int"],m:["+ enqueue(r: MaintenanceRequest): void","+ dequeue(): MaintenanceRequest","+ peek(): MaintenanceRequest","+ isEmpty(): boolean","+ displayAll(): void"]},
{id:"LinkedQueue",tag:"Low",cap:"#4ade80",pos:[28,10],col:"#a78bfa",a:["- head: Node","- tail: Node","- size: int"],m:["+ enqueue(r: MaintenanceRequest): void","+ dequeue(): MaintenanceRequest","+ peek(): MaintenanceRequest","+ isEmpty(): boolean","+ displayAll(): void"]},
{id:"LinkedQueue.Node",pos:[56,-1],col:"#f0abfc",a:["- data: MaintenanceRequest","- next: Node"],m:[]},
{id:"MaintenanceRequest",pos:[32,30],col:"#bef264",a:["- requestId: int","- location: String","- description: String","- priority: int","- completed: boolean"],m:["+ getRequestId(): int","+ getLocation(): String","+ getDescription(): String","+ getPriority(): int","+ isCompleted(): boolean","+ getStatus(): String","+ markCompleted(): void","+ toString(): String"]},
{id:"Serializable",st:"interface",pos:[0,-26],col:"#e6e9ff",a:[],m:[]}
];
const RL=[[2,8,"real"],[7,8,"real"],[0,2,"assoc"],[0,1,"dep"],[1,2,"dep","serialize / deserialize"],[2,3,"comp","High"],[2,4,"comp","Medium"],[2,5,"comp","Low"],[2,7,"agg","0..*  allRequests[]"],[3,6,"nest"],[4,6,"nest"],[5,6,"nest"],[6,7,"agg"]];
const SY={comp:"◆──",agg:"◇──",assoc:"──▶",dep:"┄┄▶",real:"┄┄▷",nest:"⊕──"};
const nm=c=>c.id+(c.tag?" ("+c.tag+")":"");

const cv=$("#c"),R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputEncoding=T.sRGBEncoding;
const sc=new T.Scene();sc.background=new T.Color(0x0b0d16);sc.fog=new T.Fog(0x0b0d16,90,260);
const cam=new T.PerspectiveCamera(50,1,.1,600);
sc.add(new T.HemisphereLight(0xb8c4ff,0x201830,.9));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(-30,60,40);sc.add(dl);
const gr=new T.GridHelper(220,110,0x2c3560,0x151a30);gr.position.y=.01;sc.add(gr);
const fl=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshBasicMaterial({color:0x0d1020}));fl.rotation.x=-Math.PI/2;sc.add(fl);

function cnv(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=4;return t}
const dark=new T.Color(0x0e1120),mix=(c,k)=>new T.Color(c).lerp(dark,k);
const towers=[],pick=[];
const glowT=cnv(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,"rgba(255,255,255,.9)");r.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=r;g.fillRect(0,0,128,128)});

function slab(g,c,txt,h,y0,bg,fg,font,sub,ul){
  const t=cnv(1024,h>1?160:64,(x,w,hh)=>{x.fillStyle=bg;x.fillRect(0,0,w,hh);x.fillStyle=fg;x.textBaseline="middle";
    if(sub){x.font="500 28px 'JetBrains Mono',monospace";x.globalAlpha=.7;x.fillText(sub,34,34);x.globalAlpha=1;x.font=font;x.fillText(txt,34,hh*.62)}
    else{x.font=font;x.fillText(txt,28,hh/2+1);if(ul){const m=x.measureText(txt).width;x.fillRect(28,hh/2+16,m,2)}}});
  const t2=t.clone();t2.wrapS=T.RepeatWrapping;t2.repeat.x=-1;t2.offset.x=1;t2.needsUpdate=true;
  const side=new T.MeshStandardMaterial({color:bg,roughness:.5,metalness:.1,transparent:c.st?true:false,opacity:c.st?.6:1});
  const mats=[side,side,side,side,new T.MeshBasicMaterial({map:t,transparent:!!c.st,opacity:c.st?.6:1}),new T.MeshBasicMaterial({map:t2,transparent:!!c.st,opacity:c.st?.6:1})];
  const m=new T.Mesh(new T.BoxGeometry(W,h,DP),mats);m.position.y=y0+h/2;m.userData.c=c;g.add(m);pick.push(m);return m}

function buildTowers(){
  CL.forEach((c,i)=>{
    const g=new T.Group();g.position.set(c.pos[0],0,c.pos[1]);
    const n=c.a.length+c.m.length,H=HH+GAP+n*(MH+GAP)+(c.a.length&&c.m.length?.15:0);c.H=H;let y=H;
    const col=c.col;
    const pl=new T.Mesh(new T.BoxGeometry(W+1,.25,DP+1),new T.MeshStandardMaterial({color:mix(col,.7),emissive:col,emissiveIntensity:.15}));pl.position.y=.12;g.add(pl);
    const gl=new T.Mesh(new T.PlaneGeometry(W*2.4,DP*3.6),new T.MeshBasicMaterial({map:glowT,color:col,transparent:true,opacity:.35,blending:T.AdditiveBlending,depthWrite:false}));gl.rotation.x=-Math.PI/2;gl.position.y=.03;g.add(gl);
    y-=HH;slab(g,c,c.id==="LinkedQueue.Node"?"Node":c.id,HH,y,col,"#0b0d16","800 52px 'Bricolage Grotesque',sans-serif",c.st?"«"+c.st+"»":(c.tag?"priority queue · "+c.tag:(c.id==="LinkedQueue.Node"?"inner class of LinkedQueue":"class")));
    if(c.cap){const cp=new T.Mesh(new T.BoxGeometry(W+.2,.14,DP+.2),new T.MeshBasicMaterial({color:c.cap}));cp.position.y=H+.07;g.add(cp)}
    y-=GAP;
    for(const s of c.a){y-=MH;slab(g,c,s.replace("{static} ","").replace("{transient} ",""),MH,y,mix(col,.72).getStyle(),"#e8ecff","600 27px 'JetBrains Mono',monospace",null,s.includes("{static}"));if(s.includes("{transient}"))g.children[g.children.length-1].userData.tr=1;y-=GAP}
    if(c.a.length&&c.m.length)y-=.15;
    for(const s of c.m){y-=MH;slab(g,c,s.replace("{static} ",""),MH,y,mix(col,.52).getStyle(),"#f4f6ff","600 27px 'JetBrains Mono',monospace",null,s.includes("{static}"));y-=GAP}
    sc.add(g);towers.push(g);g.userData.i=i});
}

/* relations */
const rels=[],slot=CL.map(()=>({n:0,k:0}));RL.forEach(r=>{slot[r[0]].n++;slot[r[1]].n++});
const up=new T.Vector3(0,1,0);
function anchor(i){const s=slot[i],o=(s.k++-(s.n-1)/2)*Math.min(1.6,(W-2)/Math.max(1,s.n-1)),c=CL[i];return new T.Vector3(c.pos[0]+o,c.H+.35,c.pos[1])}
function buildRels(){
  RL.forEach(([a,b,ty,lb],k)=>{
    const A=CL[a],B=CL[b],pa=anchor(a),pb=anchor(b);pb.y=B.H+.15;
    const d=pa.distanceTo(pb),top=Math.max(pa.y,pb.y)+3+d*.22;
    const cu=new T.CubicBezierCurve3(pa,pa.clone().lerp(pb,.25).setY(top),pa.clone().lerp(pb,.75).setY(top),pb);
    const col=new T.Color(A.col).lerp(new T.Color(0xffffff),.25),grp=new T.Group(),mats=[];
    const mt=new T.MeshBasicMaterial({color:col,transparent:true,opacity:.9});mats.push(mt);
    const dashed=ty==="dep"||ty==="real",N=70,pts=cu.getPoints(N);
    for(let i=0;i<N;i+=(dashed?2:N)){const seg=dashed?pts.slice(i,i+2):pts;const cc=dashed?new T.LineCurve3(seg[0],seg[1]):cu;grp.add(new T.Mesh(new T.TubeGeometry(cc,dashed?1:60,.09,6,false),mt))}
    const tEnd=cu.getTangent(1),tSt=cu.getTangent(0).negate();
    const mk=(geo,pos,dir,wire)=>{const mm=new T.MeshBasicMaterial({color:wire?0x0b0d16:col,transparent:true,opacity:.95});mats.push(mm);const m=new T.Mesh(geo,mm);m.position.copy(pos);m.quaternion.setFromUnitVectors(up,dir);grp.add(m);if(wire){const l=new T.LineSegments(new T.EdgesGeometry(geo),new T.LineBasicMaterial({color:col}));l.position.copy(pos);l.quaternion.copy(m.quaternion);grp.add(l)}};
    if(ty==="assoc"||ty==="dep")mk(new T.ConeGeometry(.5,1.1,12),pb.clone().addScaledVector(tEnd,-.45),tEnd);
    if(ty==="real")mk(new T.ConeGeometry(.65,1.2,3),pb.clone().addScaledVector(tEnd,-.5),tEnd,true);
    const sd=tSt.clone().negate();
    if(ty==="comp")mk(new T.OctahedronGeometry(.6).scale(1,1.6,1),pa.clone().addScaledVector(sd,.4),sd);
    if(ty==="agg")mk(new T.OctahedronGeometry(.6).scale(1,1.6,1),pa.clone().addScaledVector(sd,.4),sd,true);
    if(ty==="nest"){const tr=new T.Mesh(new T.TorusGeometry(.38,.1,8,20),mt);tr.position.copy(pa.clone().addScaledVector(sd,.45));tr.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),sd);grp.add(tr)}
    if(lb){const sp=lbl(lb);sp.position.copy(cu.getPoint(.5)).add(new T.Vector3(0,1.1,0));grp.add(sp)}
    const dot=new T.Mesh(new T.SphereGeometry(.28,10,10),new T.MeshBasicMaterial({color:0xffffff}));grp.add(dot);
    sc.add(grp);rels.push({a,b,mats,cu,dot,k,ty})});
}
function lbl(t){const w=Math.max(160,t.length*17+40);const tx=cnv(w,48,(x,w,h)=>{x.fillStyle="rgba(11,13,22,.85)";x.fillRect(0,0,w,h);x.strokeStyle="rgba(160,175,255,.45)";x.strokeRect(1,1,w-2,h-2);x.fillStyle="#eef1ff";x.font="600 24px 'JetBrains Mono',monospace";x.textAlign="center";x.textBaseline="middle";x.fillText(t,w/2,h/2+1)});
  const s=new T.Sprite(new T.SpriteMaterial({map:tx,depthWrite:false,fog:false}));s.scale.set(w/48*1.5,1.5,1);return s}

/* camera */
const S={t:new T.Vector3(14,4,4),r:92,th:.55,ph:1.02};let tw=null,auto=true;
function put(){const{t,r,th,ph}=S;cam.position.set(t.x+r*Math.sin(ph)*Math.sin(th),t.y+r*Math.cos(ph),t.z+r*Math.sin(ph)*Math.cos(th));cam.lookAt(t)}
function fly(t,r,th,ph){tw={f:{x:S.t.x,y:S.t.y,z:S.t.z,r:S.r,th:S.th,ph:S.ph},to:{x:t.x,y:t.y,z:t.z,r,th:th===undefined?S.th:th,ph},k:0};auto=false}
function overview(){sel(-1);fly(new T.Vector3(14,4,4),92,.55,1.02);auto=true}

/* selection + panel */
let selI=-1;
function sel(i){selI=i;const p=$("#info");
  rels.forEach(r=>{const on=i<0||r.a===i||r.b===i;r.mats.forEach(m=>m.opacity=on?.95:.12)});
  if(i<0){p.hidden=true;return}
  const c=CL[i];let h=`<h2>${nm(c)}</h2><div class="s">${c.st?"«"+c.st+"»":"class"}</div>`;
  if(c.a.length)h+="<h3>Attributes</h3>"+c.a.map(s=>`<code>${s.replace(/</g,"&lt;")}</code>`).join("");
  if(c.m.length)h+="<h3>Methods</h3>"+c.m.map(s=>`<code>${s}</code>`).join("");
  const rr=RL.filter(r=>r[0]===i||r[1]===i);
  h+="<h3>Relationships</h3>"+rr.map(r=>`<code>${nm(CL[r[0]])} ${SY[r[2]]} ${nm(CL[r[1]])}</code>`).join("");
  p.innerHTML=h;p.hidden=false;
  fly(new T.Vector3(c.pos[0],c.H/2,c.pos[1]),Math.max(28,c.H*3.2),S.th,1.2)}
const nav=$("#nav");CL.forEach((c,i)=>{const b=document.createElement("button");b.innerHTML=`<i style="background:${c.cap||c.col}"></i>${nm(c)}`;b.onclick=()=>sel(i);nav.appendChild(b)});
const ob=document.createElement("button");ob.textContent="Overview";ob.onclick=overview;nav.appendChild(ob);
addEventListener("keydown",e=>{if(e.key==="Escape")overview()});

/* input */
const ptr=new Map();let moved=0,pd=0;const ray=new T.Raycaster(),mv=new T.Vector2();
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;auto=false;tw=null;if(ptr.size===2){const v=[...ptr.values()];pd=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)}});
cv.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===2){p.x=e.clientX;p.y=e.clientY;const v=[...ptr.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);S.r=Math.max(12,Math.min(170,S.r*pd/d));pd=d;return}
  if(e.shiftKey||e.buttons===2){const k=S.r*.0016,rx=new T.Vector3(Math.cos(S.th),0,-Math.sin(S.th)),fw=new T.Vector3(-Math.sin(S.th),0,-Math.cos(S.th));S.t.addScaledVector(rx,-dx*k).addScaledVector(fw,dy*k)}
  else{S.th-=dx*.006;S.ph=Math.max(.15,Math.min(1.5,S.ph-dy*.006))}p.x=e.clientX;p.y=e.clientY});
const up_=e=>{ptr.delete(e.pointerId)};cv.addEventListener("pointercancel",up_);
cv.addEventListener("pointerup",e=>{up_(e);if(moved<6){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pick)[0];if(h)sel(CL.indexOf(h.object.userData.c));else overview()}});
cv.addEventListener("wheel",e=>{e.preventDefault();S.r=Math.max(12,Math.min(170,S.r*(e.deltaY>0?1.1:.91)));auto=false},{passive:false});
cv.addEventListener("contextmenu",e=>e.preventDefault());
const K={};addEventListener("keydown",e=>K[e.code]=1);addEventListener("keyup",e=>K[e.code]=0);

function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<.9?68:50;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(tw){tw.k=Math.min(1,tw.k+dt/1.1);const e=tw.k<.5?2*tw.k*tw.k:1-Math.pow(-2*tw.k+2,2)/2,f=tw.f,o=tw.to,l=(a,b)=>a+(b-a)*e;S.t.set(l(f.x,o.x),l(f.y,o.y),l(f.z,o.z));S.r=l(f.r,o.r);S.th=l(f.th,o.th);S.ph=l(f.ph,o.ph);if(tw.k>=1)tw=null}
  else if(auto)S.th+=dt*.06;
  const fw=(K.KeyW?1:0)-(K.KeyS?1:0),rt=(K.KeyD?1:0)-(K.KeyA?1:0);if(fw||rt){S.t.x+=(-Math.sin(S.th)*fw+Math.cos(S.th)*rt)*dt*30;S.t.z+=(-Math.cos(S.th)*fw-Math.sin(S.th)*rt)*dt*30;auto=false}
  rels.forEach(r=>{const t=((now/1000)*.1+r.k*.13)%1;r.dot.position.copy(r.cu.getPoint(t));r.dot.visible=selI<0||r.a===selI||r.b===selI});
  put();R.render(sc,cam)}

const go=()=>{buildTowers();buildRels();put();requestAnimationFrame(frame)};
let done=false;const fin=()=>{if(!done){done=true;go()}};
Promise.race([Promise.all([document.fonts.load("800 52px 'Bricolage Grotesque'"),document.fonts.load("600 27px 'JetBrains Mono'")]),new Promise(r=>setTimeout(r,1800))]).then(fin,fin);
})();
</script>
</body></html>
